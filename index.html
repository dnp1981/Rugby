<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Radar de Actividades CULP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root {
  --bg: #0a0e14;
  --bg-2: #0f1520;
  --surface: #141b26;
  --surface-2: #1a2330;
  --surface-3: #202a3a;
  --border: #253142;
  --border-bright: #384658;
  --text: #e8ecf1;
  --text-dim: #8b9cb3;
  --text-mute: #5a6b82;
  --team-a: #e43d3d;
  --team-a-dim: #7a2020;
  --team-a-bg: rgba(228, 61, 61, 0.14);
  --team-b: #3d8de4;
  --team-b-dim: #204e7a;
  --team-b-bg: rgba(61, 141, 228, 0.14);
  --field: #1d8a4a;
  --field-dark: #0e5b30;
  --accent: #fbbf24;
  --accent-dim: #92700f;
  --success: #22c55e;
  --danger: #ef4444;
  --warn: #f59e0b;
  --display: 'Bebas Neue', sans-serif;
  --body: 'Archivo', system-ui, -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--body);
  font-size: 14px;
  min-height: 100vh;
  overscroll-behavior: none;
  -webkit-font-smoothing: antialiased;
}
body {
  background-image:
    radial-gradient(ellipse at 15% -5%, rgba(228, 61, 61, 0.08), transparent 45%),
    radial-gradient(ellipse at 85% -5%, rgba(61, 141, 228, 0.08), transparent 45%);
  padding-bottom: 96px;
}

/* Header */
.header {
  position: sticky; top: 0; z-index: 10;
  background: rgba(10, 14, 20, 0.94);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 10px 14px;
}
.header-inner { display: flex; align-items: center; gap: 10px; max-width: 900px; margin: 0 auto; }
.logo {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 2px;
  color: var(--accent);
  flex: 1;
  line-height: 1;
}
.logo-accent { color: var(--text); }

.mini-score {
  display: flex;
  align-items: center;
  gap: 8px;
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 700;
  color: var(--text);
}
.mini-score .sep { color: var(--text-mute); }
.mini-score .a { color: var(--team-a); }
.mini-score .b { color: var(--team-b); }

.icon-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text);
  width: 34px; height: 34px;
  border-radius: 8px;
  font-size: 16px;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  padding: 0;
}
.icon-btn:active { transform: scale(0.94); }

/* Team toggle */
.team-toggle {
  max-width: 900px;
  margin: 12px auto 0;
  padding: 0 14px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.team-btn {
  background: var(--surface);
  border: 2px solid var(--border);
  border-radius: 12px;
  padding: 10px 12px;
  cursor: pointer;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  transition: all 0.15s;
  text-align: left;
  color: var(--text);
}
.team-btn .tb-label {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 2px;
  color: var(--text-mute);
  margin-bottom: 2px;
}
.team-btn .tb-name {
  font-family: var(--display);
  font-size: 22px;
  letter-spacing: 1.5px;
  line-height: 1;
  margin-bottom: 4px;
}
.team-btn .tb-score {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
}
.team-btn.a .tb-name { color: var(--team-a); }
.team-btn.a .tb-score { color: var(--team-a); }
.team-btn.b .tb-name { color: var(--team-b); }
.team-btn.b .tb-score { color: var(--team-b); }
.team-btn.a.active {
  background: var(--team-a-bg);
  border-color: var(--team-a);
  box-shadow: 0 0 0 3px rgba(228, 61, 61, 0.15);
}
.team-btn.b.active {
  background: var(--team-b-bg);
  border-color: var(--team-b);
  box-shadow: 0 0 0 3px rgba(61, 141, 228, 0.15);
}
.team-btn:active { transform: scale(0.98); }

/* Match meta */
.match-meta {
  max-width: 900px;
  margin: 8px auto 0;
  padding: 0 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  color: var(--text-dim);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.5px;
  text-transform: uppercase;
}
.half-toggle {
  display: flex;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  overflow: hidden;
}
.timer-block {
  display: flex;
  align-items: center;
  gap: 4px;
}
.timer-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 4px 10px;
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
  color: var(--text);
  height: 26px;
}
.timer-btn:active { transform: scale(0.96); }
.timer-dot {
  font-size: 9px;
  color: var(--text-mute);
  transition: color 0.2s;
}
.timer-btn.running .timer-dot {
  color: var(--success);
  animation: pulse 1.5s infinite;
}
@keyframes pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}
.timer-text {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.5px;
  color: var(--text);
}
.timer-btn.running .timer-text { color: var(--success); }
.timer-reset {
  background: var(--surface);
  border: 1px solid var(--border);
  color: var(--text-mute);
  width: 26px;
  height: 26px;
  border-radius: 6px;
  cursor: pointer;
  font-size: 13px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}
.timer-reset:hover { color: var(--text); border-color: var(--border-bright); }
.timer-reset:active { transform: scale(0.94); }
.half-toggle button {
  background: transparent;
  border: none;
  color: var(--text-mute);
  padding: 5px 11px;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 1.5px;
  cursor: pointer;
  transition: all 0.15s;
}
.half-toggle button.active {
  background: var(--accent);
  color: #000;
}

/* Section titles */
.section-title {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 2.5px;
  color: var(--text-mute);
  margin: 18px auto 8px;
  padding: 0 14px;
  max-width: 900px;
  display: flex;
  align-items: center;
  gap: 8px;
  text-transform: uppercase;
}
.section-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: linear-gradient(to right, var(--border), transparent);
}
.step-num {
  background: var(--accent);
  color: #000;
  min-width: 18px; height: 18px;
  padding: 0 5px;
  border-radius: 9px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0;
}
.step-num.done { background: var(--success); color: #fff; }
.step-num.wait { background: var(--surface-2); color: var(--text-mute); border: 1px solid var(--border); }

/* Field */
.field-wrap {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 14px;
}
.field-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 6px;
  font-size: 11px;
  color: var(--text-dim);
  letter-spacing: 0.5px;
  font-weight: 600;
  text-transform: uppercase;
}
.field-dir b { color: var(--accent); font-weight: 700; }

.field {
  position: relative;
  background: linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
  border-radius: 12px;
  padding: 10px;
  border: 2px solid rgba(255,255,255,0.08);
  background-image:
    linear-gradient(180deg, rgba(255,255,255,0.04) 0%, transparent 50%, rgba(0,0,0,0.12) 100%),
    linear-gradient(180deg, var(--field) 0%, var(--field-dark) 100%);
}
.zones {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 5px;
}
.zone {
  background: rgba(0,0,0,0.22);
  border: 2px solid rgba(255,255,255,0.12);
  border-radius: 8px;
  padding: 10px 4px;
  text-align: center;
  cursor: pointer;
  transition: all 0.15s;
  min-height: 82px;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  position: relative;
  overflow: hidden;
}
.zone::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
  pointer-events: none;
}
.zone.danger { background: rgba(239, 68, 68, 0.22); border-color: rgba(239, 68, 68, 0.35); }
.zone.attack { background: rgba(34, 197, 94, 0.22); border-color: rgba(34, 197, 94, 0.35); }
.zone:active { transform: scale(0.95); }
.zone.selected {
  background: var(--accent);
  border-color: #fff;
  color: #000;
}
.zone.selected::after {
  content: '✓';
  position: absolute;
  top: 3px; right: 5px;
  font-size: 10px;
  font-weight: 900;
  color: rgba(0,0,0,0.6);
}
.zone-num {
  font-family: var(--display);
  font-size: 16px;
  font-weight: 400;
  line-height: 1;
  color: rgba(255,255,255,0.7);
  margin-bottom: 3px;
  letter-spacing: 1px;
}
.zone.selected .zone-num { color: rgba(0,0,0,0.65); }
.zone-label {
  font-size: 10px;
  font-weight: 700;
  line-height: 1.15;
  color: rgba(255,255,255,0.95);
  text-transform: uppercase;
  letter-spacing: 0.2px;
}
.zone.selected .zone-label { color: rgba(0,0,0,0.78); }

/* Selection bar */
.selection-bar {
  max-width: 900px;
  margin: 6px auto 0;
  padding: 0 14px;
}
.selection-inner {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 3px 8px;
  display: flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  min-height: 26px;
}
.sel-label {
  font-family: var(--display);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-mute);
  flex-shrink: 0;
}
.chip {
  display: inline-flex !important;
  align-items: center;
  justify-content: center;
  padding: 1px 6px !important;
  border-radius: 3px !important;
  font-family: var(--body);
  font-size: 9.5px !important;
  font-weight: 700;
  letter-spacing: 0.2px;
  border: 1px solid transparent;
  line-height: 1;
  height: 15px !important;
  min-height: 15px !important;
  max-height: 15px !important;
  white-space: nowrap;
  box-sizing: border-box;
}
.chip.team-a { background: var(--team-a-bg); color: var(--team-a); border-color: var(--team-a-dim); }
.chip.team-b { background: var(--team-b-bg); color: var(--team-b); border-color: var(--team-b-dim); }
.chip.field-zone { background: rgba(251, 191, 36, 0.14); color: var(--accent); border-color: var(--accent-dim); }
.chip.empty { background: var(--surface-2); color: var(--text-mute); border-color: var(--border); }
/* Pill is alias of chip — used in popups */
.pill { display: inline-flex; align-items: center; justify-content: center; padding: 1px 6px; border-radius: 3px; font-family: var(--body); font-size: 9.5px; font-weight: 700; letter-spacing: 0.2px; border: 1px solid transparent; line-height: 1; height: 15px; white-space: nowrap; }
.pill.team-a { background: var(--team-a-bg); color: var(--team-a); border-color: var(--team-a-dim); }
.pill.team-b { background: var(--team-b-bg); color: var(--team-b); border-color: var(--team-b-dim); }
.pill.field-zone { background: rgba(251, 191, 36, 0.14); color: var(--accent); border-color: var(--accent-dim); }
.clear-zone {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-mute);
  padding: 0 6px;
  border-radius: 3px;
  font-size: 9px;
  font-weight: 700;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-transform: uppercase;
  height: 15px;
  margin-left: auto;
  flex-shrink: 0;
  display: inline-flex;
  align-items: center;
}
.clear-zone:hover { color: var(--text); border-color: var(--border-bright); }

/* Events grid */
.events-grid {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 14px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 6px;
}
.event-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 9px 4px;
  color: var(--text);
  cursor: pointer;
  transition: all 0.15s;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  min-height: 62px;
}
.event-btn:active { transform: scale(0.96); }
.event-btn:hover { border-color: var(--border-bright); background: var(--surface-2); }
.event-btn.disabled {
  opacity: 0.38;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(0.5);
}
.event-btn.score {
  border-color: var(--accent-dim);
  background: linear-gradient(180deg, rgba(251, 191, 36, 0.10), var(--surface));
}
.event-btn.score:hover { border-color: var(--accent); }
.event-btn.danger {
  border-color: rgba(239, 68, 68, 0.3);
  background: linear-gradient(180deg, rgba(239, 68, 68, 0.08), var(--surface));
}
.event-btn.danger:hover { border-color: var(--danger); }
.event-btn.attack {
  border-color: rgba(34, 197, 94, 0.3);
  background: linear-gradient(180deg, rgba(34, 197, 94, 0.08), var(--surface));
}
.event-btn.attack:hover { border-color: var(--success); }
.event-icon {
  font-size: 16px;
  line-height: 1;
  color: var(--text-dim);
}
.event-btn.score .event-icon { color: var(--accent); }
.event-btn.danger .event-icon { color: var(--danger); }
.event-btn.attack .event-icon { color: var(--success); }
.event-name {
  font-family: var(--display);
  font-size: 12px;
  letter-spacing: 0.8px;
  text-align: center;
  line-height: 1.05;
  text-transform: uppercase;
}

.events-hint {
  max-width: 900px;
  margin: 8px auto 0;
  padding: 8px 14px 0;
  text-align: center;
  font-size: 11px;
  color: var(--text-mute);
  letter-spacing: 0.3px;
}

/* Stats panel */
.stats-panel {
  max-width: 900px;
  margin: 0 auto;
  padding: 0 14px;
}
.stats-toggle {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 14px;
  color: var(--text);
  cursor: pointer;
  font-family: var(--display);
  font-size: 13px;
  letter-spacing: 1.5px;
  width: 100%;
  text-align: left;
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.stats-toggle .chev { transition: transform 0.2s; color: var(--text-mute); }
.stats-toggle.open .chev { transform: rotate(180deg); }

.stats-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px;
  margin-top: 10px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 12px;
}
.stat-label {
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 1.5px;
  color: var(--text-mute);
  margin-bottom: 6px;
  text-transform: uppercase;
}
.stat-row {
  display: grid;
  grid-template-columns: 1fr 1.4fr 1fr;
  align-items: center;
  padding: 3px 0;
  font-size: 12px;
}
.stat-row .a { color: var(--team-a); text-align: left; }
.stat-row .b { color: var(--team-b); text-align: right; }
.stat-row .val { font-family: var(--mono); font-weight: 700; font-size: 13px; }
.stat-row .lbl { color: var(--text-dim); text-align: center; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.3px; }

.heatmap {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  margin-top: 5px;
}
.heat-cell {
  aspect-ratio: 1;
  border-radius: 5px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  color: var(--text-dim);
}
.heatmap-labels {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 3px;
  margin-top: 3px;
  font-size: 8.5px;
  color: var(--text-mute);
  text-align: center;
  font-weight: 600;
}
.possession-bar {
  display: flex;
  height: 22px;
  border-radius: 4px;
  overflow: hidden;
  background: var(--surface-2);
}
.poss-side {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-weight: 800;
  font-size: 11px;
  color: #fff;
  transition: width 0.4s ease;
  min-width: 30px;
}
.poss-side.a { background: linear-gradient(90deg, var(--team-a-dim), var(--team-a)); }
.poss-side.b { background: linear-gradient(90deg, var(--team-b), var(--team-b-dim)); }

/* Bottom bar */
.bottom-bar {
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: rgba(10, 14, 20, 0.96);
  backdrop-filter: blur(14px);
  -webkit-backdrop-filter: blur(14px);
  border-top: 1px solid var(--border);
  padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
  display: grid;
  grid-template-columns: 1fr 1fr 1.2fr;
  gap: 7px;
  z-index: 9;
}
.bar-btn {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px 6px;
  color: var(--text);
  cursor: pointer;
  font-family: var(--display);
  font-size: 11px;
  letter-spacing: 1px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.bar-btn-icon { font-size: 16px; line-height: 1; }
.bar-btn:active { transform: scale(0.96); }
.bar-btn.primary {
  background: var(--accent);
  color: #000;
  border-color: var(--accent);
  font-weight: 800;
}

/* Modal */
.modal-backdrop {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.78);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  padding: 14px;
  animation: fadeIn 0.15s;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
.modal {
  background: var(--surface);
  border: 1px solid var(--border-bright);
  border-radius: 16px;
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  animation: slideUp 0.2s;
  margin-bottom: env(safe-area-inset-bottom);
}
@keyframes slideUp { from { transform: translateY(24px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
.modal-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 14px 16px;
  border-bottom: 1px solid var(--border);
  gap: 10px;
}
.modal-back {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-mute);
  width: 30px; height: 30px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 15px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}
.modal-back:hover { color: var(--text); border-color: var(--border-bright); }
.modal-title {
  font-family: var(--display);
  font-size: 16px;
  letter-spacing: 1.2px;
  color: var(--accent);
  flex: 1;
  line-height: 1.2;
}
.modal-body { padding: 14px 16px 18px; }

.ctx-strip {
  display: flex;
  align-items: center;
  gap: 5px;
  margin-bottom: 14px;
  padding: 4px 8px;
  background: var(--bg-2);
  border: 1px solid var(--border);
  border-radius: 5px;
  font-size: 10px;
}
.ctx-strip .ctx-label {
  font-family: var(--display);
  font-size: 9px;
  letter-spacing: 1px;
  color: var(--text-mute);
  margin-right: 2px;
}

/* Outcome grid */
.outcome-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.outcome-grid.cols-1 { grid-template-columns: 1fr; }
.outcome-grid.cols-3 { grid-template-columns: repeat(2, 1fr); }
.outcome-btn {
  padding: 18px 12px;
  border-radius: 12px;
  font-family: var(--display);
  font-size: 15px;
  letter-spacing: 1px;
  cursor: pointer;
  border: 2px solid;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  background: var(--surface);
  color: var(--text);
  text-align: center;
  line-height: 1.1;
}
.outcome-btn .oc-hint {
  font-family: var(--body);
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.3px;
  color: var(--text-mute);
  text-transform: none;
}
.outcome-btn.won { border-color: var(--success); color: var(--success); background: rgba(34,197,94,0.08); }
.outcome-btn.won .oc-hint { color: rgba(34,197,94,0.7); }
.outcome-btn.lost { border-color: var(--danger); color: var(--danger); background: rgba(239,68,68,0.08); }
.outcome-btn.lost .oc-hint { color: rgba(239,68,68,0.7); }
